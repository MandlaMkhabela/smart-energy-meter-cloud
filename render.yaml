services:
  - type: web
    name: smart-energy-meter-group55
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-meter-db
          property: connectionString
      - key: MQTT_BROKER
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_TOPIC
        value: wits/group55/mandla-main001/data

databases:
  - name: smart-meter-db
    plan: free
